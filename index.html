<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">DEV<span>.</span></div>
            <nav>
                <a href="#about">About</a>
                <a href="#projects">Work</a>
                <a href="#contact" class="nav-cta">Contact Me</a>
            </nav>
        </div>
    </header>

    <section class="hero-split">
        <div class="hero-left">
            <div class="content-wrapper">
                <p class="intro-tag">Hello World, I'm</p>
                <h1>Creative <span class="accent-text">Web</span> Developer</h1>
                <p class="description">
                    I specialize in building interactive, accessible, and high-performance front-end experiences. 
                    Let's turn your ideas into a digital reality.
                </p>
                <div class="social-icons">
                    <span>LinkedIn</span> / <span>GitHub</span> / <span>Twitter</span>
                </div>
            </div>
        </div>

        <div class="hero-right">
            <div class="image-frame">
                <img src="KPL33.jpg" alt="Developer Portrait" class="main-photo">
                <div class="experience-badge">
                    <span class="num">2026</span>
                    <span class="txt">Edition</span>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
